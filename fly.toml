# Fly.io. See docs/DEPLOY.md, "Fly.io". Rename the app, then:
#   fly launch --no-deploy --copy-config      (answer no to a database; create the volume below)
#   fly volumes create trivia_data --size 1
#   fly secrets set SESSION_SECRET=... GOOGLE_CLIENT_ID=... GOOGLE_CLIENT_SECRET=... HOSTS_JSON='{"admins":["you@gmail.com"],"hosts":[]}'
#   fly deploy
# Run exactly one machine: game state is in memory and the database is a single SQLite file.
app = "your-trivia"
primary_region = "iad"

[build]
  dockerfile = "deploy/fly/Dockerfile"

[env]
  PORT = "3000"
  DB_PATH = "/data/trivia.db"
  # Must match the address people use, with no trailing slash. Change this to your real URL.
  BASE_URL = "https://your-trivia.fly.dev"

[mounts]
  source = "trivia_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
