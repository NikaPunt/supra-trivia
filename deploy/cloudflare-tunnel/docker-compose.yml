# Docker Compose with a Cloudflare Tunnel: no open ports and no certificates to manage.
# Run from the repository root:
#   docker compose --env-file .env -f deploy/cloudflare-tunnel/docker-compose.yml up -d --build
# Create the tunnel in Cloudflare (Zero Trust > Networks > Tunnels), copy its token into .env as TUNNEL_TOKEN,
# and add a public hostname (for example trivia.example.com) with service  http://trivia:3000
services:
  trivia:
    build: ../..
    restart: unless-stopped
    init: true # hands "stop" to the app at once, so it shuts down cleanly
    stop_grace_period: 15s
    mem_limit: 512m
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    env_file: ../../.env
    environment:
      DB_PATH: /data/trivia.db
      HOSTS_FILE: /config/hosts.json
    volumes:
      - ../../data:/data
      - ../../config:/config:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on: [trivia]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
