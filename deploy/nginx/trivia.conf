# nginx in front of the app. Save as /etc/nginx/sites-available/trivia, link it into sites-enabled, then run
#   sudo certbot --nginx -d trivia.example.com
# certbot adds the HTTPS server block and the redirect for you.
server {
    listen 80;
    server_name trivia.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, don't append: the app trusts this header for rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Live updates are server-sent events: no buffering, and let a stream stay open.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
