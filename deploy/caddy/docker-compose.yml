# Docker Compose with Caddy in front: automatic HTTPS and nothing else to install.
# Run from the repository root:
#   docker compose --env-file .env -f deploy/caddy/docker-compose.yml up -d --build
# Needs DOMAIN in .env, a DNS record pointing at this machine, and ports 80 and 443 open.
services:
  trivia:
    build: ../..
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DB_PATH: /data/trivia.db
      HOSTS_FILE: /config/hosts.json
    volumes:
      - ../../data:/data
      - ../../config:/config:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # No ports are published: only Caddy reaches the app, over the private network.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [trivia]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, for example trivia.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
