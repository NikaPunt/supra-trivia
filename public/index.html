<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trivia</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#0f0d0a"><link rel="stylesheet" href="/styles.css"><script src="/js/theme.js"></script></head>
<body><main>
<div id="hero"></div>
<h1>Join the table</h1>
<form id="join" class="card">
  <label for="code">Room code</label><input id="code" autocomplete="off" autocapitalize="characters" maxlength="10" required>
  <label for="nick">Your name or team name</label><input id="nick" autocomplete="off" maxlength="24" required>
  <label for="pin">PIN (optional, 4 digits)</label><input id="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off">
  <p class="muted">Set a PIN so you can get back in under the same name if your phone locks or reloads.</p>
  <p class="err" id="err"></p>
  <button class="primary">Take a seat</button>
</form>
<p class="muted">Hosting a trivia? <a href="/auth/login">Log in</a></p>
<p class="muted geo" style="font-size:.9rem">The look is after the paintings of Niko Pirosmani (ნიკო ფიროსმანი).</p>
</main><footer class="foot"></footer><script type="module" src="/js/index.js"></script></body></html>
