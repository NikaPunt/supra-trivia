services:
  trivia:
    build: .
    container_name: trivia
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/trivia.db
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    # No ports published: only Nginx Proxy Manager reaches this over the shared network.

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
